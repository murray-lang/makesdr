syntax = "proto3";

package makesdr;

import "RadioSettings.proto";

enum RadioPayloadType {
  PAYLOAD_NONE = 0;
  PAYLOAD_CAPABILITIES = 1;
  PAYLOAD_SETTINGS_BASIC_RX = 2;
  PAYLOAD_SETTINGS_BASIC_RXTX = 3;
  PAYLOAD_SETTINGS_SINGLE_IQ_RX = 4;
  PAYLOAD_SETTINGS_SINGLE_IQ_RXTX = 5;
  PAYLOAD_SETTINGS_DUAL_IQ_RX = 6;
  PAYLOAD_SETTINGS_DUAL_IQ_RXTX = 7;
  PAYLOAD_SETTINGS_SPLIT_BAND_DUAL_IQ_RXTX = 8;
  PAYLOAD_FIELD_UPDATE = 10;
  PAYLOAD_MODES = 20;
  PAYLOAD_BANDS = 21;
  PAYLOAD_LOOKUP = 22;
  PAYLOAD_CACHE_BASIC = 30;
  PAYLOAD_CACHE_SINGLE_IQ = 31;
  PAYLOAD_CACHE_DUAL_IQ = 32;
  PAYLOAD_CACHE_DUAL_IQ_RXTX = 33;
  PAYLOAD_IQ = 40;
  PAYLOAD_RX_METERING = 41;
  PAYLOAD_SPECTRUM = 42;
}

enum RadioPayloadPurpose {
  PURPOSE_NONE = 0;
  PURPOSE_MERGE = 1;
  PURPOSE_REPLACE = 2;
}

enum RadioPayloadSource {
  SOURCE_UNKNOWN = 0;
  SOURCE_BACK_END = 1;
  SOURCE_FRONT_END = 2;
}

message RadioPayloadHeaderPb {
  RadioPayloadType payloadType = 1;
  RadioPayloadSource source = 2;
  RadioPayloadPurpose purpose = 3;
}

message RadioPayloadBasePb {
    RadioPayloadHeaderPb header = 1;
}

//message TxCapabilitiesPb {
//  bool split_band = 1;
//}
//
//message IqCapabilitiesPb {
//  bool dual_pipeline = 1;
//  optional uint32 sample_rate = 2;
//}

message FrequencyRangePb {
  int64 min = 1;
  int64 max = 2;
}

message CapabilitiesPb {
  RadioPayloadType settings_type = 1;
//  bool rx = 1;
//  TxCapabilitiesPb tx = 2;
//  IqCapabilitiesPb iq = 3;
  optional uint32 sample_rate = 2;
  repeated FrequencyRangePb frequency_ranges = 4;
}

message CapabilitiesPayloadPb {
  RadioPayloadHeaderPb header = 1;
  CapabilitiesPb body = 2;
}


message BasicRxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  BasicRxSettingsPb body = 2;
}

message SingleIqRxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  SingleIqRxSettingsPb body = 2;
}

message DualIqRxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  DualIqRxSettingsPb body = 2;
}

message BasicRxTxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  BasicRxTxSettingsPb body = 2;
}

message SingleIqRxTxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  SingleIqRxTxSettingsPb body = 2;
}

message DualIqRxTxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  DualIqRxTxSettingsPb body = 2;
}

message SplitBandDualIqRxTxSettingsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  SplitBandDualIqRxTxSettingsPb body = 2;
}

message ModesPayloadPb {
  RadioPayloadHeaderPb header = 1;
  ModeListPb body = 2;
}

message BandsPayloadPb {
  RadioPayloadHeaderPb header = 1;
  BandCategoryListPb body = 2;
}

message RadioLookupPayloadPb {
  RadioPayloadHeaderPb header = 1;
  RadioLookupPb body = 2;
}

message RadioCacheBasicPayloadPb {
  RadioPayloadHeaderPb header = 1;
  BasicBandSettingsCachePb body = 2;
}

message RadioCacheSingleIqPayloadPb {
  RadioPayloadHeaderPb header = 1;
  SingleIqBandSettingsCachePb body = 2;
}

message RadioCacheDualIqPayloadPb {
  RadioPayloadHeaderPb header = 1;
  DualIqBandSettingsCachePb body = 2;
}

message RadioCacheRxTxDualIqPayloadPb {
  RadioPayloadHeaderPb header = 1;
  RxTxDualIqBandSettingsCachePb body = 2;
}

message FieldUpdatePayloadPb {
  RadioPayloadHeaderPb header = 1;
  FieldUpdatePb body = 2;
}

message IqPayloadPb {
  RadioPayloadHeaderPb header = 1;
  IqPb body = 2;
}

message SpectrumPayloadPb {
  RadioPayloadHeaderPb header = 1;
  SpectrumPb body = 2;
}

message RxMeteringPayloadPb {
  RadioPayloadHeaderPb header = 1;
  RxMeteringPb body = 2;
}

